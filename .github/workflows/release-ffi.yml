name: Release FFI Binaries

on:
  push:
    tags:
      - "v*"
  # Lets you run this from the Actions tab on any branch/commit to test the
  # build+package steps without cutting a real version tag. The final
  # release-publish step still only runs on an actual tag push (see below).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build and package thryve_ffi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Release-only build. This is what produces target/release/thryve_ffi.dll
      # and its import library, thryve_ffi.dll.lib, and also regenerates
      # crates/thryve_ffi/out/thryve.h and thryve_ffi.h fresh from this exact
      # build (via build.rs), so the packaged header always matches the packaged
      # binary.
      - run: cargo build --release -p thryve_ffi

      - name: Assemble dist folder
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path "$dist/include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist/lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist/bin" | Out-Null

          Copy-Item "crates/thryve_ffi/out/thryve.h" "$dist/include/thryve.h"
          Copy-Item "crates/thryve_ffi/out/thryve_ffi.h" "$dist/include/thryve_ffi.h"
          Copy-Item "target/release/thryve_ffi.dll" "$dist/bin/thryve_ffi.dll"
          # The DLL's import library, under the name C linkers look for. The build's own
          # thryve_ffi.lib is the static library, which would build the whole library into
          # the program and never use the DLL.
          Copy-Item "target/release/thryve_ffi.dll.lib" "$dist/lib/thryve_ffi.lib"

      - name: Zip dist folder
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Compress-Archive -Path "dist/*" -DestinationPath "thryve_ffi-$version-x64.zip"

      # Always uploaded, including on manual test runs, so you can download
      # and inspect the zip from the Actions run page without needing a
      # real release.
      - uses: actions/upload-artifact@v4
        with:
          name: thryve_ffi-x64
          path: thryve_ffi-*-x64.zip

      # Only actually publish to a GitHub Release on a real tag push, so
      # manual test runs (workflow_dispatch) don't create stray releases.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: thryve_ffi-*-x64.zip
