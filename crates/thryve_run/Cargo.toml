[package]
    name = "thryve_run"
    version = "0.1.0"
    edition.workspace = true
    license.workspace = true
    homepage.workspace = true
    repository.workspace = true
    readme.workspace = true
    description = "Runtime logic for the Thryve runtime. Handles interactive and service logic and initialization."   # per-crate, not shared
    keywords = ["initialization", "interactive", "service", "internal"]


[dependencies]
    thryve_core = { path = "../thryve_core" , version = "0.1.0"}
    thryve_utils = { path = "../thryve_utils" , version = "0.1.0"}
    thryve_observers = { path = "../thryve_observers" , version = "0.1.0"}

    # External Dependencies.
    windows ={ version = "0.62.2", features = ["Win32_System_Services", "Win32_Foundation"] }
    windows-services.workspace = true
    crossbeam.workspace = true
    chrono.workspace = true