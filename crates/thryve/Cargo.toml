[package]
    name = "thryve"
    version = "0.1.0"
    edition.workspace = true
    license.workspace = true
    homepage.workspace = true
    repository.workspace = true
    readme = "README.md"
    description = "A pluggable task/plugin/observer runtime for Rust, runnable interactively or as a Windows service."
    keywords = ["multithreading", "automation", "runtime", "plugin", "observer"]
    categories = ["concurrency", "development-tools", "asynchronous"]

# Thryve builds on Windows only, for now, so docs.rs documents it for Windows.
[package.metadata.docs.rs]
    default-target = "x86_64-pc-windows-msvc"
    targets = ["x86_64-pc-windows-msvc"]

[dependencies]
    thryve_utils = { path = "../thryve_utils" , version = "0.1.0"}
    thryve_run = { path = "../thryve_run" , version = "0.1.0"}