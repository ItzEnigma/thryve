[package]
    name = "thryve_ffi"
    version = "0.1.0"
    edition.workspace = true
    license.workspace = true
    homepage.workspace = true
    repository.workspace = true
    readme = "README.md"
    description = "C-compatible FFI bindings for the Thryve runtime, for use from C, C++, and other native languages."
    keywords = ["multithreading", "ffi", "c-bindings", "automation", "runtime"]
    categories = ["concurrency", "development-tools", "external-ffi-bindings"]
    exclude = ["out/"]

[package.metadata.release]
    verify = false

# Thryve builds on Windows only, for now, so docs.rs documents it for Windows.
[package.metadata.docs.rs]
    default-target = "x86_64-pc-windows-msvc"
    targets = ["x86_64-pc-windows-msvc"]

[dependencies]
    thryve_utils = { path = "../thryve_utils" , version = "0.1.0" }
    thryve_run = { path = "../thryve_run" , version = "0.1.0" }
    crossbeam.workspace = true

[build-dependencies]
    cbindgen = "0.29"

[dev-dependencies]
    cbindgen = "0.29"

[lib]
    crate-type = ["cdylib", "staticlib", "rlib"]
