[workspace]
    members = [
        "thryve_run",
        "thryve_core",
        "thryve_utils",
        "thryve_observers",
        "thryve",
        ]

    resolver = "3"

[workspace.dependencies]
    windows-services = "0.25.0"
    strum = { version = "0.27.2" , features = ["derive"] }
    strum_macros = "0.27.2"
    chrono = "0.4.41"
    crossbeam = "0.8.4"
    crossbeam-skiplist = "0.1.3"

