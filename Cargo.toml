[workspace]
    members = [
        "thryve_run",
        "thryve_core",
        "thryve_utils",
        "thryve_observers",
        "thryve_tests",
        "thryve",
        "thryve_ffi",
        ]

    resolver = "3"

[workspace.dependencies]
    windows-services = "0.26.1"
    strum = { version = "0.28.0" , features = ["derive"] }
    strum_macros = "0.28.0"
    chrono = "0.4.44"
    crossbeam = "0.8.4"
    crossbeam-skiplist = "0.1.3"
    ron = "0.12"
    petgraph = {version = "0.8.3" , features = ["serde-1"]}
    serde = { version = "1.0.228" , features = ["derive"] }
    tokio = "1"
    anyhow = "1.0.102"
    thiserror = "2.0.18"
